name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint · typecheck · build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (tsc)
        run: npx tsc --noEmit --project tsconfig.app.json

      - name: Build (Vite)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # ─── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend (lint · typecheck · test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy pytest pytest-asyncio httpx

      - name: Lint (Ruff)
        run: ruff check backend/

      - name: Format check (Ruff)
        run: ruff format --check backend/

      - name: Type check (Mypy)
        run: mypy backend/ --ignore-missing-imports --explicit-package-bases
        continue-on-error: true  # Non-blocking until type coverage improves

      - name: Tests (Pytest)
        run: |
          if [ -d "backend/tests" ] && [ "$(find backend/tests -name 'test_*.py' | wc -l)" -gt 0 ]; then
            pytest backend/tests/ -v --tb=short
          else
            echo "⚠️  No tests found in backend/tests/ — skipping. This is acceptable for v1.0 demo but must be addressed before production."
          fi

      - name: Security scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --skip-editable
        continue-on-error: true  # Advisory; review output manually

  # ─── Dependency audit ─────────────────────────────────────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true  # Advisory; does not block merge

  # ─── Summary ──────────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Backend:  ${{ needs.backend.result }}"
          if [[ "${{ needs.frontend.result }}" != "success" || "${{ needs.backend.result }}" != "success" ]]; then
            echo "❌ CI failed — see job logs above"
            exit 1
          fi
          echo "✅ All checks passed"
