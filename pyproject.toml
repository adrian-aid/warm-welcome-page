[tool.ruff]
# Ruff replaces flake8, isort, pyupgrade, and more
target-version = "py39"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default arguments (FastAPI uses this)
    "RUF012", # mutable class attributes — acceptable in Pydantic models
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = false
# Gradually increase strictness as coverage improves
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_functions = ["test_*"]
# Silence noisy warnings from third-party packages
filterwarnings = [
    "ignore::DeprecationWarning:langchain",
    "ignore::DeprecationWarning:pydantic",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/data/cache/*",
    "backend/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 0  # Set to 60 when test suite is established
